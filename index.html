<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6a62">
<meta name="color-scheme" content="light">
<title>Анализ семьи</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Анализ семьи">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3bb8a6"/><stop offset="1" stop-color="#0a4d47"/></linearGradient>
  <symbol id="logo" viewBox="0 0 100 100">
   <rect width="100" height="100" rx="26" fill="url(#lg)"/>
   <path d="M50 77C22 58 17 39 30 29c9-6.5 17-2.5 20 5 3-7.500 11-11.500 20-5 13 10 8 29-20 48z" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/>
   <path d="M21 52h16l6-13 9 25 6-12h21" fill="none" stroke="#f3c969" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
 </defs>
</svg>

<!-- ============ ОБЛОЖКА ============ -->
<section id="cover">
 <div class="cv-bg"><i></i><i></i><i></i><div class="cv-grid"></div></div>
 <div class="cv-in">
  <svg class="logo"><use href="#logo"/></svg>
  <h1 class="cv-t">Анализ семьи</h1>
  <p class="cv-s">Здоровье каждого близкого человека — в одном месте. Было, стало, что делать дальше.</p>
  <svg class="cv-ecg" viewBox="0 0 230 30" fill="none"><path d="M0 15h70l8-11 10 24 9-13h28l6-9 8 18 5-9h86" stroke="#f3c969" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="cv-av" id="cvAv"></div>
  <form class="pin" id="pinForm" autocomplete="off">
   <input id="pw" type="hidden">
   <div class="dots" id="dots" role="img" aria-label="Введите код"><i></i><i></i><i></i><i></i></div>
   <div class="pad" id="pad"><button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button><button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button><button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button><button type="button" data-k="C" class="sm" aria-label="Стереть всё">С</button><button type="button" data-k="0">0</button><button type="button" data-k="B" class="sm" aria-label="Стереть цифру">⌫</button></div>
  </form>
  <p class="cv-err" id="cvErr" role="alert"></p>
  <button class="cv-demo" id="demoBtn" type="button">Посмотреть на демо-данных</button>
  <div class="cv-foot">Данные зашифрованы · открываются только по паролю</div>
 </div>
</section>

<!-- ============ ПРИЛОЖЕНИЕ ============ -->
<div id="app" class="hide">
 <header class="top">
  <div class="top-r">
   <div class="brand"><svg><use href="#logo"/></svg><span id="ttl">Анализ семьи</span></div>
   <div>
    <button class="ib no-print" id="bPrint" title="Печать / PDF" aria-label="Печать"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><rect x="6" y="14" width="12" height="7" rx="1"/></svg></button><button class="ib" id="bSet" title="Настройки" aria-label="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button><button class="ib" id="bLock" title="Заблокировать" aria-label="Заблокировать"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
   </div>
  </div>
  <div class="chips" id="chips"></div>
 </header>
 <main id="view"></main>
 <nav class="dock" id="dock" aria-label="Разделы">
  <a data-t="o"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Обзор</a>
  <a data-t="c"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 4L3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg>Сравнение</a>
  <a data-t="a"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Анализы</a>
  <a data-t="d"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Динамика</a>
  <a data-t="r"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.900c.6.5 1 1.200 1 2V16h5v-.1c0-.8.4-1.500 1-2A6 6 0 0 0 12 3z"/></svg>Советы</a>
 </nav>
</div>

</html>
